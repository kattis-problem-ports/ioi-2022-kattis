author: Hazem Issa
source: International Olympiad in Informatics (IOI) 2022, Day 2
source_url: https://ioi2022.id/tasks/
license: cc by-sa
type: scoring
validation: custom interactive score

limits:
  # Slowest AC is 0.39s, so this reproduces the original contest limit of 2s.
  # Kept generous on purpose: a solution near the 40000-call cap pays about 0.4s
  # in pipe round-trips that the original in-process grader did not.
  time_multiplier: 5
  # The original contest limit was 2 GiB (every upstream run_cpp.sh sets
  # "ulimit -v 2097152"); Kattis' default would be 1024 MB.
  memory: 2048

grading:
  show_test_data_groups: true
