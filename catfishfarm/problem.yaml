author: Lim Rui Yuan
source: International Olympiad in Informatics (IOI) 2022, Day 1
source_url: https://ioi2022.id/tasks/
license: cc by-sa
type: scoring

limits:
  # Slowest AC is 0.15-0.48s depending on the machine. No submission fails on
  # time near the boundary -- the intended-too-slow ones run out of memory
  # instead -- so there is no strong signal and this is the default.
  time_multiplier: 3
  # The original contest limit was 2 GiB (every upstream run_cpp.sh sets
  # "ulimit -v 2097152"); Kattis' default would be 1024 MB.
  memory: 2048

grading:
  show_test_data_groups: true
